<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let me know you're looking</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./assets/supabase-client.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 480px;
      margin: 2rem auto;
      padding: 0 1.25rem;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; }
    p.intro { color: #555; line-height: 1.4; }
    label { display: block; margin-top: 1.1rem; font-weight: 600; font-size: 0.95rem; }
    .hint { font-weight: 400; color: #777; font-size: 0.85rem; }
    input[type="text"], input[type="url"], textarea, select {
      width: 100%;
      padding: 0.6rem;
      margin-top: 0.35rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    textarea { min-height: 4rem; resize: vertical; }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { background: #999; }
    .error { color: #b00020; font-size: 0.9rem; margin-top: 0.5rem; }
    .confirmation { text-align: center; padding: 3rem 0; }
    /* Honeypot: hidden from real people, visible to basic bots */
    .hp-field { position: absolute; left: -9999px; top: -9999px; }
  </style>
</head>
<body>

  <div id="form-view">
    <h1>Let me know you're looking</h1>
    <p class="intro">Less than a minute. I'll keep this in mind as things come across my desk — no promises, but I do actually check this.</p>

    <form id="seeker-form">
      <label for="name">Name *</label>
      <input type="text" id="name" required autocomplete="name" />

      <label for="linkedin_url">LinkedIn profile link *</label>
      <input type="url" id="linkedin_url" required placeholder="https://www.linkedin.com/in/..." />

      <label for="location">Where are you located / what locations could you work from? *</label>
      <input type="text" id="location" required placeholder="e.g. Columbus, OH" />

      <label for="work_preference">Work preference <span class="hint">(optional)</span></label>
      <select id="work_preference">
        <option value="">— No preference specified —</option>
        <option value="remote_only">Remote only</option>
        <option value="prefers_remote">Prefers remote</option>
        <option value="open_to_relocation">Open to relocation</option>
        <option value="local_only">Local only</option>
      </select>

      <label for="relationship_note">How do we know each other? <span class="hint">(optional)</span></label>
      <input type="text" id="relationship_note" placeholder="e.g. worked together at..." />

      <label for="notes">Anything you'd like me to know? <span class="hint">(optional)</span></label>
      <textarea id="notes" placeholder="Role types, industries, deal-breakers, timeline..."></textarea>

      <!-- Honeypot field: real users never see or fill this in -->
      <div class="hp-field" aria-hidden="true">
        <label for="website">Leave this blank</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
      </div>

      <div id="error" class="error" style="display:none;"></div>
      <button type="submit" id="submit-btn">Submit</button>
    </form>
  </div>

  <div id="confirmation-view" class="confirmation" style="display:none;">
    <h1>Thanks!</h1>
    <p>Got it — I'll keep an eye out.</p>
  </div>

  <script>
    const form = document.getElementById("seeker-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");

    function isPlausibleLinkedInUrl(url) {
      try {
        const parsed = new URL(url);
        return parsed.protocol.startsWith("http");
      } catch {
        return false;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";

      const name = document.getElementById("name").value.trim();
      const linkedin_url = document.getElementById("linkedin_url").value.trim();
      const location = document.getElementById("location").value.trim();
      const work_preference = document.getElementById("work_preference").value || null;
      const relationship_note = document.getElementById("relationship_note").value.trim() || null;
      const notes = document.getElementById("notes").value.trim() || null;
      const honeypot = document.getElementById("website").value;

      if (!name || !linkedin_url || !location) {
        errorEl.textContent = "Please fill in your name, LinkedIn link, and location.";
        errorEl.style.display = "block";
        return;
      }
      if (!isPlausibleLinkedInUrl(linkedin_url)) {
        errorEl.textContent = "That doesn't look like a valid URL — please check the LinkedIn link.";
        errorEl.style.display = "block";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      const { error } = await supabaseClient.rpc("submit_job_seeker", {
        p_name: name,
        p_linkedin_url: linkedin_url,
        p_location: location,
        p_work_preference: work_preference,
        p_relationship_note: relationship_note,
        p_notes: notes,
        p_honeypot: honeypot
      });

      if (error) {
        errorEl.textContent = "Something went wrong submitting this — please try again in a moment.";
        errorEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
        return;
      }

      document.getElementById("form-view").style.display = "none";
      document.getElementById("confirmation-view").style.display = "block";
    });
  </script>
</body>
</html>
