<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive — Talent Marketplace</title>
  <script src="../assets/site-config.js"></script>
  <script src="../assets/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../assets/supabase-client.js"></script>
  <script src="../assets/admin-table.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body class="page-wide" x-data="adminApp('archived')" x-init="init()" @keydown.escape.window="onEscape()">

  <div x-show="!session">
    <h1>Archive</h1>
    <button @click="login()">Sign in with GitHub</button>
  </div>

  <div x-show="session && !isAdmin && checkedAdmin">
    <h1>Not authorized</h1>
    <p>This GitHub account isn't on the admin allow-list for this instance.</p>
  </div>

  <div id="admin-main" x-show="session && isAdmin" x-cloak>
    <div class="top-bar">
      <h1>Archive</h1>
      <a class="back-link" href="./index.html">← Back to admin</a>
    </div>

    <div class="tabs">
      <button :class="{active: tab === 'seekers'}" @click="tab = 'seekers'; openFilter = null">Job Seekers (<span x-text="filteredSeekers.length"></span>)</button>
      <button :class="{active: tab === 'hiring'}" @click="tab = 'hiring'; openFilter = null">Hiring Contacts (<span x-text="filteredHiring.length"></span>)</button>
    </div>

    <!-- Search, filters, chips, row count -->
    <input type="text" placeholder="Search archived records..." x-model="searchTerm" />

    <div class="filter-bar">
      <template x-if="tab === 'seekers'">
        <div class="filters">
          <template x-for="def in filterDefs" :key="def.group">
            <div class="filter" @click.outside="if (openFilter === def.group) openFilter = null">
              <button type="button" class="filter-btn" aria-haspopup="true"
                      :aria-expanded="openFilter === def.group"
                      @click="openFilter = (openFilter === def.group ? null : def.group)">
                <span x-text="def.label"></span><span x-show="filters[def.group].length" x-text="` (${filters[def.group].length})`"></span> ▾
              </button>
              <div class="filter-panel" x-show="openFilter === def.group" x-cloak>
                <template x-for="opt in def.options" :key="opt.value">
                  <label class="filter-option">
                    <input type="checkbox" :checked="filters[def.group].includes(opt.value)" @change="toggleFilter(def.group, opt.value)" />
                    <span x-text="opt.label"></span>
                  </label>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>
      <span class="row-count" aria-live="polite" x-text="`Showing ${rows.length} of ${totalCount}`"></span>
    </div>

    <div class="chips" x-show="chips.length" x-cloak>
      <template x-for="chip in chips" :key="chip.key">
        <button type="button" class="chip" @click="removeChip(chip)"><span x-text="chip.text"></span> <span aria-hidden="true">×</span></button>
      </template>
      <button type="button" class="link-button" @click="clearFilters()">Clear filters</button>
    </div>

    <!-- Table: one row per record; the whole row opens the overlay -->
    <div class="table-wrap" id="list-anchor" tabindex="-1">
      <template x-if="rows.length === 0"><p class="empty-state" x-text="emptyText"></p></template>
      <table class="data-table" x-show="rows.length">
        <thead>
          <tr>
            <template x-for="col in columns" :key="col.key">
              <th scope="col" :aria-sort="ariaSort(col)">
                <button type="button" class="sort-btn" @click="setSort(col)">
                  <span x-text="col.label"></span><span class="sort-arrow" aria-hidden="true" x-text="sortArrow(col)"></span>
                </button>
              </th>
            </template>
          </tr>
        </thead>
        <tbody>
          <template x-for="row in rows" :key="row.id">
            <tr tabindex="0"
                @click="openRecord(tab, row, $el)"
                @keydown.enter.self="openRecord(tab, row, $el)"
                @keydown.space.self.prevent="openRecord(tab, row, $el)">
              <template x-for="col in columns" :key="col.key">
                <td>
                  <template x-if="col.type === 'link'">
                    <a :href="safeUrl(row[col.key])" target="_blank" rel="noopener" @click.stop x-text="linkHost(row[col.key])"></a>
                  </template>
                  <template x-if="col.type !== 'link'">
                    <span x-text="cellText(col, row)"></span>
                  </template>
                </td>
              </template>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Overlay card: full record + every action -->
  <template x-if="selected">
    <div class="overlay-backdrop" @mousedown="backdropMouse($event, $el)" @click="backdropClick($event, $el)">
      <div id="record-dialog" class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="record-title"
           tabindex="-1" @keydown.tab="trapTab($event)">
        <div class="overlay-header">
          <h2 id="record-title" x-text="selected.record.name"></h2>
          <button type="button" class="overlay-close" @click="requestClose()" :aria-disabled="busy">Close</button>
        </div>

        <dl class="detail-list">
          <template x-for="f in detailFields" :key="f.key">
            <div class="detail-row">
              <dt x-text="f.label"></dt>
              <dd>
                <template x-if="f.type === 'url' && selected.record[f.key]">
                  <a :href="safeUrl(selected.record[f.key])" target="_blank" rel="noopener" x-text="selected.record[f.key]"></a>
                </template>
                <template x-if="!(f.type === 'url' && selected.record[f.key])">
                  <span x-text="cellText(f, selected.record)"></span>
                </template>
              </dd>
            </div>
          </template>
        </dl>

        <div class="rating-buttons" x-show="selected.kind === 'seekers'">
          <strong style="font-size:0.9rem;">Rating:</strong>
          <template x-for="n in [1,2,3,4,5]" :key="n">
            <button type="button" :class="{selected: selected.record.rating === n}" :aria-pressed="selected.record.rating === n"
                    @click="setRating(n)" x-text="n"></button>
          </template>
        </div>

        <textarea class="admin-notes" placeholder="Private admin notes..." aria-label="Private admin notes"
                  x-model="draftNotes" @blur="saveNotes()"></textarea>

        <p class="error" role="alert" x-show="error" x-text="error"></p>

        <div class="overlay-actions">
          <button type="button" @click="unarchive()" :aria-disabled="busy">Un-archive</button>
        </div>

        <div class="danger-zone">
          <template x-if="deleteStep === 0">
            <button type="button" class="btn-danger-outline" @click="startDelete()">Delete permanently</button>
          </template>
          <template x-if="deleteStep === 1">
            <div>
              <p class="delete-confirm">Permanently delete <strong x-text="selected.record.name"></strong>? This can't be undone.</p>
              <button type="button" id="delete-cancel" @click="cancelDelete()" :aria-disabled="busy">Cancel</button>
              <button type="button" class="btn-danger" @click="deleteRecord()" :aria-disabled="busy">Delete</button>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <div class="toast" role="status" aria-live="polite" x-show="toast" x-text="toast" x-cloak></div>
</body>
</html>
